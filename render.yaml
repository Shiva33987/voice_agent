services:
  - type: web
    name: inbound-agent-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inbound-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: inbound-agent-redis
          property: connectionString
      - key: DEPLOYMENT_MODE
        value: oss
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000
      - key: OSS_JWT_SECRET
        generateValue: true

databases:
  - name: inbound-agent-db
    plan: starter
    databaseName: dograh
    user: postgres

redis:
  - name: inbound-agent-redis
    plan: starter
    ipAllowList: []

